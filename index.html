<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Webhook Sender Avanzado Pro</title>
    <style>
        :root {
            --primary-color: #5865f2; /* Discord Blurple */
            --background-dark: #313338;
            --background-light: #3c3f45;
            --text-primary: #dcddde;
            --text-secondary: #72767d;
            --accent-color: #43b581; /* Discord Green */
            --box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            --border-radius: 5px;
            --padding-small: 8px;
            --padding-medium: 12px;
            --margin-small: 8px;
            --margin-medium: 16px;
            --font-family: 'gg sans', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic Pro', '游ゴシック Medium', Meiryo, 'MS PGothic', sans-serif;
            --transition-duration: 0.2s ease-in-out;
            --input-border: #4f545c;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background-dark);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: var(--margin-medium);
            box-sizing: border-box;
        }

        .container {
            background-color: var(--background-light);
            padding: var(--padding-medium) calc(var(--margin-medium) * 1.5);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 700px;
        }

        h2 {
            text-align: center;
            margin-bottom: var(--margin-medium);
            color: var(--primary-color);
        }

        .form-section {
            margin-bottom: calc(var(--margin-medium) * 1.5);
            padding: var(--padding-medium);
            border-radius: var(--border-radius);
            background-color: rgba(0, 0, 0, 0.1); /* Sutil fondo para agrupar */
        }

        .form-section h3 {
            color: var(--text-primary);
            margin-top: 0;
            margin-bottom: var(--margin-small);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: var(--margin-small);
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="color"],
        input[type="number"],
        textarea {
            width: calc(100% - 2 * var(--padding-small));
            padding: var(--padding-small);
            margin-top: 5px;
            border: 1px solid var(--input-border);
            border-radius: var(--border-radius);
            background-color: #202225;
            color: var(--text-primary);
            box-sizing: border-box;
            font-size: 1rem;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: var(--padding-medium);
            border: none;
            border-radius: var(--border-radius);
            background-color: var(--primary-color);
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            transition: background-color var(--transition-duration);
        }

        button:hover {
            background-color: #4c56aa;
        }

        #status-simple, #status-embed, #file-status {
            text-align: center;
            margin-top: var(--margin-medium);
            font-size: 0.9rem;
        }

        .footer {
            position: absolute;
            bottom: 10px;
            left: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .file-upload {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-top: var(--margin-small);
            border: 1px dashed var(--text-secondary);
            padding: var(--padding-small);
            border-radius: var(--border-radius);
            text-align: center;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            color: var(--text-secondary);
            transition: border-color var(--transition-duration);
        }

        .file-upload:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .file-upload input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
        }

        #file-name {
            margin-top: 5px;
            font-size: 0.8rem;
            color: var(--text-primary);
            text-align: center;
        }

        /* Nuevos estilos para campos adicionales del embed */
        .embed-fields-container {
            margin-top: var(--margin-small);
        }

        .embed-field {
            display: flex;
            gap: var(--margin-small);
            margin-bottom: var(--margin-small);
        }

        .embed-field input[type="text"] {
            flex-grow: 1;
        }

        .add-field-button {
            background: none;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: var(--padding-small);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color var(--transition-duration), color var(--transition-duration);
            width: 100%;
            box-sizing: border-box;
            margin-top: var(--margin-small);
        }

        .add-field-button:hover {
            background-color: var(--accent-color);
            color: var(--background-light);
        }

        .field-inline-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Media query para hacerlo aún más responsive */
        @media (max-width: 600px) {
            .container {
                padding: var(--padding-medium);
                margin: var(--margin-small);
            }

            .embed-field {
                flex-direction: column;
            }

            .footer {
                position: static;
                text-align: center;
                margin-top: var(--margin-medium);
                left: auto;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Discord Webhook Sender Avanzado Pro</h2>

        <div class="form-section">
            <h3>Enviar Mensaje Simple</h3>
            <div class="form-group">
                <label for="webhook-url-simple">URL del Webhook</label>
                <input type="text" id="webhook-url-simple" placeholder="Introduce la URL del webhook" required>
            </div>
            <div class="form-group">
                <label for="message-simple">Mensaje</label>
                <textarea id="message-simple" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>
            <button onclick="sendSimpleWebhook()">Enviar Mensaje</button>
            <p id="status-simple"></p>
        </div>

        <div class="form-section">
            <h3>Enviar Embed Personalizado</h3>
            <div class="form-group">
                <label for="webhook-url-embed">URL del Webhook</label>
                <input type="text" id="webhook-url-embed" placeholder="Introduce la URL del webhook" required>
            </div>
            <div class="form-group">
                <label for="embed-title">Título del Embed</label>
                <input type="text" id="embed-title" placeholder="Introduce el título del embed" required>
            </div>
            <div class="form-group">
                <label for="embed-description">Descripción del Embed</label>
                <textarea id="embed-description" placeholder="Escribe la descripción del embed"></textarea>
            </div>
            <div class="form-group">
                <label for="color-picker">Color del Embed</label>
                <input type="color" id="color-picker" value="#5865f2">
            </div>
            <div class="form-group">
                <label for="url">URL del Embed (Opcional)</label>
                <input type="text" id="url" placeholder="Introduce la URL del embed">
            </div>
            <div class="form-group">
                <label for="image-url">URL de la Imagen (Opcional)</label>
                <input type="text" id="image-url" placeholder="Introduce la URL de la imagen">
            </div>
            <div class="form-group">
                <label for="thumbnail-url">URL de la Miniatura (Opcional)</label>
                <input type="text" id="thumbnail-url" placeholder="Introduce la URL de la miniatura">
            </div>
            <div class="form-group">
                <label for="footer-text">Texto del Footer (Opcional)</label>
                <input type="text" id="footer-text" placeholder="Introduce el texto del footer">
            </div>
            <div class="form-group">
                <label for="footer-icon">URL del Icono del Footer (Opcional)</label>
                <input type="text" id="footer-icon" placeholder="Introduce la URL del icono del footer">
            </div>
            <div class="form-group">
                <label for="author-name">Nombre del Autor (Opcional)</label>
                <input type="text" id="author-name" placeholder="Introduce el nombre del autor">
            </div>
            <div class="form-group">
                <label for="author-url">URL del Autor (Opcional)</label>
                <input type="text" id="author-url" placeholder="Introduce la URL del autor">
            </div>
            <div class="form-group">
                <label for="author-icon">URL del Icono del Autor (Opcional)</label>
                <input type="text" id="author-icon" placeholder="Introduce la URL del icono del autor">
            </div>

            <h3>Campos Adicionales del Embed</h3>
            <div id="embed-fields-container">
                </div>
            <button type="button" class="add-field-button" onclick="addEmbedField()">Añadir Campo</button>

            <button onclick="sendEmbed()">Enviar Embed</button>
            <p id="status-embed"></p>
        </div>

        <div class="form-section">
            <h3>Enviar Archivo</h3>
            <div class="form-group">
                <label for="webhook-url-file">URL del Webhook</label>
                <input type="text" id="webhook-url-file" placeholder="Introduce la URL del webhook" required>
            </div>
            <div class="form-group">
                <label for="file-upload">Seleccionar Archivo</label>
                <div class="file-upload">
                    <input type="file" id="file-upload-input">
                    <span>Arrastra y suelta o haz clic para seleccionar un archivo</span>
                </div>
                <p id="file-name"></p>
            </div>
            <button onclick="sendFile()">Enviar Archivo</button>
            <p id="file-status"></p>
        </div>

    </div>

    <div class="footer">
        <p>&copy; 2025 <a href="https://discord.com" target="_blank">Discord Webhook Sender Avanzado Pro</a></p>
    </div>

    <script>
        // Variables de estado para la carga de archivos
        let selectedFile = null;
        const fileInput = document.getElementById('file-upload-input');
        const fileNameDisplay = document.getElementById('file-name');
        const fileStatusDisplay = document.getElementById('file-status');
        const embedFieldsContainer = document.getElementById('embed-fields-container');

        fileInput.addEventListener('change', function() {
            selectedFile = this.files[0];
            if (selectedFile) {
                fileNameDisplay.innerText = 'Archivo seleccionado: ' + selectedFile.name;
            } else {
                fileNameDisplay.innerText = '';
            }
        });

        function addEmbedField() {
            const fieldDiv = document.createElement('div');
            fieldDiv.classList.add('embed-field');

            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.classList.add('field-name');
            nameInput.placeholder = 'Nombre del Campo';

            const valueInput = document.createElement('input');
            valueInput.type = 'text';
            valueInput.classList.add('field-value');
            valueInput.placeholder = 'Valor del Campo';

            const inlineContainer = document.createElement('div');
            inlineContainer.classList.add('field-inline-container');
            const inlineCheckbox = document.createElement('input');
            inlineCheckbox.type = 'checkbox';
            inlineCheckbox.classList.add('field-inline');
            const inlineLabel = document.createElement('label');
            inlineLabel.innerText = 'En línea';
            inlineLabel.style.fontSize = '0.9rem';
            inlineLabel.style.color = 'var(--text-secondary)';

            inlineContainer.appendChild(inlineCheckbox);
            inlineContainer.appendChild(inlineLabel);

            fieldDiv.appendChild(nameInput);
            fieldDiv.appendChild(valueInput);
            fieldDiv.appendChild(inlineContainer);

            embedFieldsContainer.appendChild(fieldDiv);
        }

        // Función para enviar un mensaje simple
        function sendSimpleWebhook() {
            const webhookUrl = document.getElementById('webhook-url-simple').value;
            const message = document.getElementById('message-simple').value;
            const statusElement = document.getElementById('status-simple');

            if (!webhookUrl || !message) {
                statusElement.innerText = 'Por favor, rellena los campos obligatorios.';
                statusElement.style.color = 'orange';
                return;
            }

            statusElement.innerText = 'Enviando mensaje...';
            statusElement.style.color = 'var(--primary-color)';

            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ content: message })
            })
            .then(response => {
                if (response.ok) {
                    statusElement.innerText = 'Mensaje enviado con éxito!';
                    statusElement.style.color = 'var(--accent-color)';
                } else {
                    statusElement.innerText = 'Error al enviar el mensaje.';
                    statusElement.style.color = 'red';
                    console.error('Error al enviar el webhook:', response.status);
                }
            })
            .catch(error => {
                statusElement.innerText = 'Error de red al enviar el mensaje.';
                statusElement.style.color = 'red';
                console.error('Error de red:', error);
            });
        }

        // Función para enviar un embed personalizado
        function sendEmbed() {
            const webhookUrl = document.getElementById('webhook-url-embed').value;
            const embedTitle = document.getElementById('embed-title').value;
            const embedDescription = document.getElementById('embed-description').value;
            const color = document.getElementById('color-picker').value || '#5865f2';
            const url = document.getElementById('url').value;
            const imageUrl = document.getElementById('image-url').value;
            const thumbnailUrl = document.getElementById('thumbnail-url').value;
            const footerText = document.getElementById('footer-text').value;
            const footerIcon = document.getElementById('footer-icon').value;
            const authorName = document.getElementById('author-name').value;
            const authorUrl = document.getElementById('author-url').value;
            const authorIcon = document.getElementById('author-icon').value;
            const statusElement = document.getElementById('status-embed');
            const fieldContainers = document.querySelectorAll('#embed-fields-container .embed-field');
            const fields = [];

            fieldContainers.forEach(container => {
                const nameInput = container.querySelector('.field-name');
                const valueInput = container.querySelector('.field-value');
                const inlineCheckbox = container.querySelector('.field-inline');
                if (nameInput && valueInput) {
                    fields.push({
                        name: nameInput.value,
                        value: valueInput.value,
                        inline: inlineCheckbox ? inlineCheckbox.checked : false
                    });
                }
            });

            if (!webhookUrl || !embedTitle) {
                statusElement.innerText = 'Por favor, rellena los campos obligatorios para el embed.';
                statusElement.style.color = 'orange';
                return;
            }

            statusElement.innerText = 'Enviando embed...';
            statusElement.style.color = 'var(--primary-color)';

            const embed = {
                title: embedTitle,
                description: embedDescription || undefined,
                color: parseInt(color.replace("#", ""), 16),
                url: url || undefined,
                image: imageUrl ? { url: imageUrl } : undefined,
                thumbnail: thumbnailUrl ? { url: thumbnailUrl } : undefined,
                footer: footerText ? { text: footerText, icon_url: footerIcon } : undefined,
                author: authorName ? { name: authorName, url: authorUrl, icon_url: authorIcon } : undefined,
                fields: fields.length > 0 ? fields : undefined
            };

            const params = {
                embeds: [embed]
            };

            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(params)
            })
            .then(response => {
                if (response.ok) {
                    statusElement.innerText = 'Embed enviado con éxito!';
                    statusElement.style.color = 'var(--accent-color)';
                } else {
                    statusElement.innerText = 'Error al enviar el embed.';
                    statusElement.style.color = 'red';
                    console.error('Error al enviar el webhook:', response.status);
                }
            })
            .catch(error => {
                statusElement.innerText = 'Error de red al enviar el embed.';
                statusElement.style.color = 'red';
                console.error('Error de red:', error);
            });
        }

        // Función para enviar un archivo
        function sendFile() {
            const webhookUrl = document.getElementById('webhook-url-file').value;
            const statusElement = document.getElementById('file-status');

            if (!webhookUrl) {
                statusElement.innerText = 'Por favor, introduce la URL del webhook.';
                statusElement.style.color = 'orange';
                return;
            }

            if (!selectedFile) {
                statusElement.innerText = 'Por favor, selecciona un archivo.';
                statusElement.style.color = 'orange';
                return;
            }

            statusElement.innerText = 'Enviando archivo...';
            statusElement.style.color = 'var(--primary-color)';

            const formData = new FormData();
            formData.append('file', selectedFile);

            fetch(webhookUrl + '?wait=true', { // Añadir ?wait=true para obtener una respuesta
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    return response.json(); // Esperar la respuesta JSON
                } else {
                    throw new Error(`Error al enviar el archivo: ${response.status}`);
                }
            })
            .then(data => {
                statusElement.innerText = `Archivo "${selectedFile.name}" enviado con éxito!`;
                statusElement.style.color = 'var(--accent-color)';
                console.log('Respuesta del webhook:', data); // Puedes mostrar información adicional si la API de Discord la devuelve
            })
            .catch(error => {
                statusElement.innerText = error.message;
                statusElement.style.color = 'red';
                console.error('Error al enviar el archivo:', error);
            });
        }
    </script>

</body>
</html>
